<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121820">
<meta name="referrer" content="no-referrer">
<title>StreamRec — вход</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/login.css">
</head>
<body class="login">
<form class="box" id="f" autocomplete="on">
  <div class="brand"><span class="dot"></span>StreamRec</div>
  <p>Удалённый доступ. Данные шифруются на вашем устройстве — облако их не видит.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Пароль" autofocus required>
  <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Код из приложения-аутентификатора" hidden>
  <button class="btn primary" type="submit" id="go">Войти</button>
  <div class="err" id="err"></div>
</form>
<script src="/static/e2e.js"></script>
<script src="/static/login.js"></script>
</body>
</html>
